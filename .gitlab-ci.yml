# GitLab CI/CD - PT2VHF APRS Client
# Pipeline automatico para publicacao de releases no pt2vhf-site/main.
# O dominio PT2VHF.com e a unica fonte publica; GitHub nao e utilizado.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build
  - package

python_tests:
  stage: test
  image: python:3.12-bookworm
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - python -m pip install -r requirements.txt "pytest>=8,<9" Pillow psutil waitress
    - python -m compileall -q pt2vhf_aprs tools windows_app.py linux_app.py macos_app.py
    - python -m pytest -q tests
  timeout: 30m

javascript_syntax:
  stage: test
  image: node:22-bookworm-slim
  script:
    - node --check pt2vhf_aprs/static/js/app.js

linux_package:
  stage: build
  image: python:3.12-bookworm
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - VERSION
        - .gitlab-ci.yml
      when: on_success
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libgtk-3-0 libglib2.0-0 libnss3 libx11-6 libxext6 libxrender1 libxkbcommon0 libdbus-1-3 libgdk-pixbuf-2.0-0 libffi-dev libjpeg-dev zlib1g-dev
  script:
    - bash linux/build_linux.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist-linux/*.tar.gz
      - dist-linux/*.deb
      - dist-linux/*.AppImage
      - dist-linux/*.json
      - dist-linux/*.txt
  timeout: 90m

windows_package:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - VERSION
        - .gitlab-ci.yml
      when: on_success
  script:
    - python -m pip install -r requirements-windows.txt
    - python -m pytest -q tests
    - python windows/make_icon.py
    - python -m PyInstaller --noconfirm --clean windows/PT2VHF_APRS_Client.spec
    - python -m PyInstaller --noconfirm windows/PT2VHF_APRS_Client_Portable.spec
    - '$version = (Get-Content VERSION -Raw).Trim()'
    - '$iss = "windows/installer.iss"'
    - '$src = Get-Content $iss -Raw'
    - '$src = $src -replace ''#define MyAppVersion "[^"]+"'',"#define MyAppVersion `"$version`""'
    - 'Set-Content -Path $iss -Value $src -Encoding UTF8'
    - '$iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"'
    - 'if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" } }'
    - 'if (-not (Test-Path $iscc)) { throw "Inno Setup 6 unavailable" }'
    - '& $iscc $iss'
    - 'Copy-Item dist/PT2VHF_APRS_Client_Portable_x64.exe "dist-installer/PT2VHF_APRS_Client_Portable_x64_v$version.exe" -Force'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist-installer/*.exe
  timeout: 90m


# Publica os cinco binarios reais no MESMO repositorio usado pela Hostinger.
# Configuracao unica necessaria no projeto pt2vhf-site:
# CI/CD > Job token permissions > habilitar push e cross-project push;
# adicionar pt2vhf-aprs-client na allowlist com permissao de repositorio.
# Nenhum PAT/FTP/SSH permanente: autenticacao com CI_JOB_TOKEN temporario.
release_aprs_to_site:
  stage: package
  image: python:3.12-alpine
  needs:
    - job: windows_package
      artifacts: true
    - job: linux_package
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - VERSION
        - .gitlab-ci.yml
      when: on_success
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - set -eu
    - version="$(tr -d '\r\n' < VERSION)"
    - 'echo "$version" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$"'
    - 'git clone --depth 1 --branch main "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/pt2vhf-group/pt2vhf-site.git" /tmp/pt2vhf-site'
    - cd /tmp/pt2vhf-site
    - mkdir -p downloads/aprs-client
    - |
      python3 - "$version" <<'PY'
      import json
      import sys
      from pathlib import Path

      version = sys.argv[1]
      path = Path("updates.json")
      data = json.loads(path.read_text(encoding="utf-8"))
      entry = data["products"]["aprs"]
      published = entry.get("version")
      if published and tuple(map(int, published.split("."))) > tuple(map(int, version.split("."))):
          sys.exit(f"Recusada regressão de {published} para {version}")
      entry["developmentVersion"] = version
      # Nao altera contadores historicos: sao armazenados no servidor PHP.
      for package in Path("downloads/aprs-client").iterdir():
          if package.is_file() and (
              (package.name.startswith("PT2VHF_APRS_Client_") and
               package.name.endswith((".exe", ".AppImage", ".tar.gz")))
              or (package.name.startswith("pt2vhf-aprs-client_") and package.suffix == ".deb")
          ):
              package.unlink()
      path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
      PY
    - 'cp "$CI_PROJECT_DIR/dist-installer/PT2VHF_APRS_Client_Setup_x64_v${version}.exe" downloads/aprs-client/'
    - 'cp "$CI_PROJECT_DIR/dist-installer/PT2VHF_APRS_Client_Portable_x64_v${version}.exe" downloads/aprs-client/'
    - 'cp "$CI_PROJECT_DIR/dist-linux/PT2VHF_APRS_Client_x86_64_v${version}.AppImage" downloads/aprs-client/'
    - 'cp "$CI_PROJECT_DIR/dist-linux/pt2vhf-aprs-client_${version}_amd64.deb" downloads/aprs-client/'
    - 'cp "$CI_PROJECT_DIR/dist-linux/PT2VHF_APRS_Client_Linux_x86_64_v${version}.tar.gz" downloads/aprs-client/'
    - python3 scripts/sync_aprs_manifest.py --version "$version" --apply
    - |
      python3 - "$version" <<'PY'
      import json
      import sys
      from pathlib import Path
      version = sys.argv[1]
      entry = json.loads(Path("updates.json").read_text(encoding="utf-8"))["products"]["aprs"]
      files = entry["files"]
      expected = {"win-setup-x64", "win-portable-x64", "linux-appimage-x64", "linux-deb-x64", "linux-tar-x64"}
      assert entry["version"] == version and len(files) == 5
      assert {f["counterKey"] for f in files} == expected
      assert all(f["url"].startswith("https://www.pt2vhf.com/downloads/aprs-client/")
                 and f["size"] > 0 and len(f["sha256"]) == 64 for f in files)
      assert all(f["category"] not in ("source", "checksums") for f in files)
      print(f"Validado: {len(files)} instaladores v{version}, tamanhos e SHA-256")
      PY
    - git add -A downloads/aprs-client updates.json
    - |
      if git diff --cached --quiet; then
        echo "Os pacotes desta versao ja estao no repositorio do site."
      else
        git -c user.name="PT2VHF CI" -c user.email="ci@pt2vhf.com" commit -m "release(aprs): binarios oficiais v${version}"
        git pull --rebase origin main
        git push origin HEAD:main
        echo "Commit enviado ao pt2vhf-site/main. Hostinger utiliza a integracao Git existente."
      fi
  timeout: 45m
