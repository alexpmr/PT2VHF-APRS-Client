name: Atualizar downloads da versão atual

on:
  workflow_dispatch:
  schedule:
    # De hora em hora: downloads feitos pelas atualizações do próprio
    # programa aparecem na tabela sem esperar um dia. O script só cria commit
    # quando algum contador mudou.
    - cron: "19 * * * *"
  push:
    branches: [main]
    paths:
      - tools/sync_readme_release_downloads.py
      - .github/workflows/update-download-counts.yml

permissions:
  contents: write

concurrency:
  group: downloads-versao-atual-readme
  cancel-in-progress: false

jobs:
  atualizar-contadores:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar contadores com testes locais
        run: python -m unittest discover -s tests -p test_download_totals.py -v
      - name: Consultar contadores da última release e atualizar README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/sync_readme_release_downloads.py
