      - name: Setup native ARM64 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'
          cache: 'pip'

      - name: Validate v2.0.7 production release
        shell: pwsh
        run: python tools\apply_release_2_0_7.py

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Validate Python and JavaScript syntax
        shell: pwsh
        run: |
          python -m compileall -q pt2vhf_aprs windows_app.py tools
          node --check pt2vhf_aprs\static\js\app.js
          node --check pt2vhf_aprs\static\js\i18n\es.js
          node --check pt2vhf_aprs\static\js\i18n\fr.js
          node --check pt2vhf_aprs\static\js\i18n\de-DE.js
          node --check pt2vhf_aprs\static\js\i18n\it-IT.js
          node --check pt2vhf_aprs\static\js\i18n\ja-JP.js
          node --check pt2vhf_aprs\static\js\i18n\pl-PL.js
          node --check pt2vhf_aprs\static\js\i18n\nl-NL.js
          node --check pt2vhf_aprs\static\js\i18n\zh-CN.js
          node --check pt2vhf_aprs\static\js\i18n\en.js
          node --check pt2vhf_aprs\static\js\i18n\th-TH.js
          node --check pt2vhf_aprs\static\js\tnc.js
          node --check pt2vhf_aprs\static\js\v1818.js
          node --check pt2vhf_aprs\static\js\v190.js
          node --check pt2vhf_aprs\static\js\v110.js
          node --check pt2vhf_aprs\static\js\v111.js
          node --check pt2vhf_aprs\static\js\v142.js

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Report test failures as annotations
        if: failure()
        shell: pwsh
        run: python tools\pytest_failures_to_annotations.py pytest-report.xml
      - name: Smoke HTTP real on Windows
        shell: pwsh
        run: python tools\\smoke_web_http.py

      - name: Generate Windows icon
        shell: pwsh
        run: python windows\make_icon.py

      - name: Build native ARM64 application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean windows\PT2VHF_APRS_Client.spec
          pyinstaller --noconfirm windows\PT2VHF_APRS_Client_Portable_ARM64.spec

      - name: Generate ARM64 SBOM and license inventory
        shell: pwsh
        run: |
          cyclonedx-py environment --spec-version 1.6 --output-format JSON --output-file dist\PT2VHF_APRS_Client\SBOM-Windows-arm64.cdx.json
          pip-licenses --format=plain-vertical --with-license-file --no-license-path --output-file=dist\PT2VHF_APRS_Client\THIRD_PARTY_LICENSES_Windows_arm64.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build ARM64 installer and portable EXE
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force dist-installer-arm64 | Out-Null
          $installerScript = Get-Content windows\installer_arm64.iss -Raw
          $installerScript = $installerScript -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`""
          Set-Content windows\installer_arm64.iss -Value $installerScript -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer_arm64.iss
          Copy-Item dist\PT2VHF_APRS_Client_Portable_ARM64.exe "dist-installer-arm64\PT2VHF_APRS_Client_Portable_ARM64_v$version.exe" -Force

      - name: Read version for artifact name
        shell: bash
        run: echo "APP_VERSION=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_ENV"

      # Assinatura SignPath (v2.0.7): só roda quando o segredo SIGNPATH_API_TOKEN existe.
      # Sem ele, o build segue sem assinatura como antes. Ver docs/SIGNPATH_SETUP.md.
      - name: Upload unsigned Windows ARM64 files for signing
        if: ${{ env.SIGNPATH_ENABLED == 'true' }}
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-arm64
          path: |
            dist-installer-arm64\*.exe
          retention-days: 3

      - name: Sign Windows ARM64 files with SignPath
        if: ${{ env.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-arm64

      - name: Use signed Windows ARM64 files
        if: ${{ env.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Recurse signed-arm64 -Filter *.exe
          if (-not $signed) { throw "SignPath não devolveu arquivos assinados" }
          foreach ($file in $signed) {
            Copy-Item $file.FullName (Join-Path dist-installer-arm64 $file.Name) -Force
            $sig = Get-AuthenticodeSignature (Join-Path dist-installer-arm64 $file.Name)
            Write-Host "$($file.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "Assinatura inválida em $($file.Name)" }
          }

      - name: Upload Windows ARM64 artifacts
