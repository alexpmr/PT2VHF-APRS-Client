        with:
          name: PT2VHF-APRS-Client-Windows-ARM64-v${{ env.APP_VERSION }}
          path: |
            dist-installer-arm64\PT2VHF_APRS_Client_Setup_ARM64_v*.exe
            dist-installer-arm64\PT2VHF_APRS_Client_Portable_ARM64_v*.exe
            dist\PT2VHF_APRS_Client\SBOM-Windows-arm64.cdx.json
            dist\PT2VHF_APRS_Client\THIRD_PARTY_LICENSES_Windows_arm64.txt


  windows-win7-legacy:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.8.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements-windows7.txt

      - name: Validate v1.14.38 release metadata
        shell: pwsh
        run: python tools\apply_release_2_0_7.py

      - name: Install Win7 Legacy dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip==24.3.1"
          python -m pip install -r requirements-windows7.txt

      - name: Validate Python 3.8 runtime compatibility
        shell: pwsh
        run: |
          python -m compileall -q pt2vhf_aprs windows_app.py windows_legacy_app.py
          python -c "import pkgutil,importlib,pt2vhf_aprs; [importlib.import_module(m.name) for m in pkgutil.iter_modules(pt2vhf_aprs.__path__, pt2vhf_aprs.__name__+'.')]; print('PT2VHF runtime imports OK on Python 3.8')"
          python -c "from pt2vhf_aprs.web import create_app; app=create_app(); print('Flask routes:', len(list(app.url_map.iter_rules())))"
          python tools\\smoke_web_http.py

      - name: Generate Windows icon
        shell: pwsh
        run: python windows\make_icon.py

      - name: Build and verify Win7 Legacy Portable
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist, dist-win7 -ErrorAction SilentlyContinue
          pyinstaller --noconfirm --clean windows\PT2VHF_APRS_Client_Win7_Legacy.spec
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force dist-win7 | Out-Null
          $source = "dist\PT2VHF_APRS_Client_Win7_Legacy_Portable_x64.exe"
          $portable = "dist-win7\PT2VHF_APRS_Client_Win7_Legacy_Portable_x64_v$version.exe"
          if (!(Test-Path $source)) { throw "Win7 Portable não foi gerado." }
          Copy-Item $source $portable -Force
          $probe = "dist-win7\portable-version.txt"
          $process = Start-Process -FilePath $portable -ArgumentList @("--write-version", $probe) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Probe do Portable retornou exit code $($process.ExitCode)." }
          if (!(Test-Path $probe)) { throw "Portable não gravou o version probe." }
          $embedded = (Get-Content $probe -Raw).Trim()
          if ($embedded -ne $version) { throw "Portable contém versão $embedded; esperado $version." }
          Get-FileHash $portable -Algorithm SHA256 | Format-List

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and verify Win7 Legacy installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $installerScript = Get-Content windows\installer_win7_legacy.iss -Raw
          $installerScript = $installerScript -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`""
          Set-Content windows\installer_win7_legacy.iss -Value $installerScript -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer_win7_legacy.iss
          $installer = "dist-win7\PT2VHF_APRS_Client_Setup_Win7_Legacy_x64_v$version.exe"
          if (!(Test-Path $installer)) { throw "Instalador Win7 não foi gerado." }
          $smokeDir = Join-Path $PWD "dist-win7\smoke-install"
          Remove-Item -Recurse -Force $smokeDir -ErrorAction SilentlyContinue
          $args = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$smokeDir")
          $setupProcess = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) { throw "Instalador smoke retornou exit code $($setupProcess.ExitCode)." }
          $installedExe = Join-Path $smokeDir "PT2VHF_APRS_Client_Win7_Legacy_x64.exe"
          if (!(Test-Path $installedExe)) { throw "Executável instalado não encontrado no smoke test." }
          $installedProbe = "dist-win7\installed-version.txt"
          $installedProcess = Start-Process -FilePath $installedExe -ArgumentList @("--write-version", $installedProbe) -Wait -PassThru
          if ($installedProcess.ExitCode -ne 0) { throw "Probe do executável instalado falhou." }
          $installedVersion = (Get-Content $installedProbe -Raw).Trim()
          if ($installedVersion -ne $version) { throw "Setup instalou versão $installedVersion; esperado $version." }
          Get-FileHash $installer -Algorithm SHA256 | Format-List

      - name: Read version for artifact name
        shell: bash
        run: echo "APP_VERSION=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_ENV"

      - name: Upload Win7 Legacy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-Windows-Win7-Legacy-x64-v${{ env.APP_VERSION }}
          path: |
            dist-win7\PT2VHF_APRS_Client_Setup_Win7_Legacy_x64_v*.exe
            dist-win7\PT2VHF_APRS_Client_Win7_Legacy_Portable_x64_v*.exe


  linux-x64:
    if: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')) && !contains(github.event.head_commit.message, '[windows-only]') }}
    runs-on: ubuntu-22.04  # nao usar ubuntu-latest: o Python 3.12 do 26.04 vem com -march=x86-64-v3 (AVX2) e quebra CPUs antigas (Illegal instruction, v2.0.3)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Validate v2.0.7 production release
        shell: bash
        run: python tools/apply_release_2_0_7.py

      - name: Build Linux packages
        shell: bash
        run: |
          chmod +x linux/build_linux.sh
          PYTHON_BIN=python3 bash linux/build_linux.sh

      - name: Read version for artifact name
        shell: bash
        run: echo "APP_VERSION=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_ENV"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-Linux-x86_64-v${{ env.APP_VERSION }}
          path: |
            dist-linux/PT2VHF_APRS_Client_Linux_x86_64_v*.tar.gz
            dist-linux/PT2VHF_APRS_Client_x86_64_v*.AppImage
            dist-linux/pt2vhf-aprs-client_*_amd64.deb
            dist-linux/SBOM-Linux.cdx.json
            dist-linux/THIRD_PARTY_LICENSES_Linux.txt


  linux-smoke:
    if: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')) && !contains(github.event.head_commit.message, '[windows-only]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Core smoke tests
        shell: bash
        run: |
          python tools/apply_release_2_0_7.py
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          python -m compileall -q pt2vhf_aprs linux_app.py tools
          python -m pytest -q
          python tools/i18n_audit.py --strict
          python tools/migration_matrix.py

  macos:
    if: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')) && !contains(github.event.head_commit.message, '[windows-only]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      MACOS_SIGNING_ENABLED: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Validate v2.0.7 production release
        shell: bash
        run: python tools/apply_release_2_0_7.py

      # Assinatura e notarização Apple (v2.0.7): só rodam quando os segredos MACOS_* existem.
      # Sem eles, o DMG sai sem assinatura como antes. Ver docs/MACOS_SIGNING.md.
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_SIGNING_ENABLED == 'true' }}
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/pt2vhf-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -n1 | sed -E 's/.*"(.*)"/\1/')"
          test -n "$identity" || { echo "Certificado Developer ID Application não encontrado" >&2; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build macOS DMG
        shell: bash
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          chmod +x macos/build_macos.sh
          PYTHON_BIN=python3 bash macos/build_macos.sh

      - name: Verify runner architecture
        shell: bash
        run: |
          actual="$(uname -m)"
          echo "Expected: ${{ matrix.arch }} / Actual: $actual"
          test "$actual" = "${{ matrix.arch }}"

      - name: Read version for artifact name
        shell: bash
        run: echo "APP_VERSION=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_ENV"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-macOS-${{ matrix.arch }}-v${{ env.APP_VERSION }}
          path: |
            dist-macos/PT2VHF_APRS_Client_macOS_${{ matrix.arch }}_v*.dmg
            dist-macos/SBOM-macOS-${{ matrix.arch }}.cdx.json
            dist-macos/THIRD_PARTY_LICENSES_macOS_${{ matrix.arch }}.txt

  manual-pdf:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate v2.0.7 production release
        shell: bash
        run: python tools/apply_release_2_0_7.py

      - name: Generate versioned PDF manual
        shell: bash
        run: |
          trap 'echo "::error title=manual-pdf::Falhou no comando: $BASH_COMMAND"' ERR
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "reportlab>=4.0,<5.0" "pypdf>=5.0,<7.0" "playwright>=1.55,<2.0" "cairosvg>=2.7,<3.0"
          # v1.15.9: o espelho apt do runner às vezes não resolve; as libs do Chrome já vêm na imagem.
          python -m playwright install --with-deps chromium || python -m playwright install chromium
          version="$(tr -d '\r\n ' < VERSION)"
          mkdir -p dist-docs/screenshots
          cp pt2vhf_aprs/static/img/app_logo.png dist-docs/manual_logo.png
          python tools/capture_manual_screenshots.py --output-dir dist-docs/screenshots
          python tools/generate_manual.py --logo dist-docs/manual_logo.png --screenshots-dir dist-docs/screenshots --output "dist-docs/PT2VHF_APRS_Client_Manual_v$version.pdf"
          python tools/validate_manual.py "dist-docs/PT2VHF_APRS_Client_Manual_v$version.pdf"

      - name: Read version for artifact name
        shell: bash
        run: echo "APP_VERSION=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_ENV"

      - name: Upload manual artifact
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-Manual-v${{ env.APP_VERSION }}
          path: dist-docs/PT2VHF_APRS_Client_Manual_v*.pdf


  publish-release:
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')) }}
    needs:
      - windows-x64
      - windows-arm64
      - windows-win7-legacy
      - linux-x64
      - linux-smoke
      - macos
      - manual-pdf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all production artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PT2VHF-APRS-Client-*
          path: release-assets
          merge-multiple: true

      - name: Setup Python for release notes
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate release notes
        shell: bash
        run: python tools/release_notes.py --output release-notes.md

      - name: Publish GitHub Release as latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < VERSION)"
          tag="v$version"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag"               --title "PT2VHF APRS Client $tag"               --notes-file release-notes.md               --latest
          else
            gh release create "$tag"               --target "$GITHUB_SHA"               --title "PT2VHF APRS Client $tag"               --notes-file release-notes.md               --latest
          fi

          mapfile -t files < <(find release-assets -type f -print | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          printf 'Uploading %s production assets\n' "${#files[@]}"
          gh release upload "$tag" "${files[@]}" --clobber

      - name: Verify published release
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n ' < VERSION)"
          tag="v$version"
          # v1.14.62: downloads oficiais só em pt2vhf.com; o README não recebe links do GitHub.

          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          echo "GitHub latest release: $latest"
          test "$latest" = "$tag"
