name: Update release download statistics

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh download table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/update_download_stats.py

      - name: Commit updated README
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "Download counters are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh release download statistics [skip ci]"
          git push origin HEAD:main
