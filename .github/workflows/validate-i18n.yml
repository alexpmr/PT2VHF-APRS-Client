name: Validate localization regression
on:
  push:
    branches: [fix/i18n-complete-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all JavaScript modules and legacy catalogs
        run: |
          for file in pt2vhf_aprs/static/js/*.js; do node --check "$file"; done
          python tools/i18n_audit.py --strict > legacy-i18n-report.json
      - name: Reject new missing literal candidates across six locales
        run: node tools/i18n_inventory.cjs --output i18n-inventory.json
      - name: Install source parser and validate complete keyed catalog
        run: |
          mkdir -p .test-runtime
          if ! (
            set -e
            npm install --no-save --package-lock=false acorn@8.15.0 || exit $?
            node tools/extract_i18n_javascript.cjs || exit $?
            python tools/export_i18n_sources.py || exit $?
            node tools/assemble_i18n_catalog.cjs || exit $?
            python tools/write_i18n_catalog.py || exit $?
            git diff --exit-code -- pt2vhf_aprs/static/js/i18n_catalog.js || exit $?
            node tests/i18n_catalog.cjs || exit $?
          ) > .test-runtime/source-validation.log 2>&1; then
            python tools/report_ci_error.py .test-runtime/source-validation.log
            exit 1
          fi
          cat .test-runtime/source-validation.log
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Exercise live DOM translations in browser
        run: node tests/i18n_dom.browser.cjs
      - name: Exercise real application tabs and language persistence
        run: |
          if ! (
            pip install -r requirements.txt pytest || exit $?
            PT2VHF_DATA_DIR="$RUNNER_TEMP/i18n-regression" python -m pytest -q --junitxml=.test-runtime/pytest-i18n.xml || exit $?
            python tools/smoke_i18n_ui.py || exit $?
            python tools/smoke_i18n_ui.py --audit || exit $?
          ) > .test-runtime/ui-regression.log 2>&1; then
            python tools/report_ci_error.py .test-runtime/ui-regression.log
            exit 1
          fi
          cat .test-runtime/ui-regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i18n-inventory-and-regression
          path: |
            legacy-i18n-report.json
            i18n-inventory.json
            .test-runtime/i18n-catalog-review.json
            .test-runtime/i18n-strict-report.json
            .test-runtime/i18n-visible-report.json
            .test-runtime/pytest-i18n.xml
            .test-runtime/source-validation.log
            .test-runtime/ui-regression.log
