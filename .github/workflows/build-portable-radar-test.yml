name: Build v1.7.22 Radar Test Portable

on:
  push:
    branches:
      - test/radar-v1.7.22
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-portable-radar-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Validate Python and JavaScript syntax
        shell: pwsh
        run: |
          python -m compileall -q pt2vhf_aprs windows_app.py tools
          node --check pt2vhf_aprs\static\js\app.js

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Generate Windows icon
        shell: pwsh
        run: python windows\make_icon.py

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean windows\PT2VHF_APRS_Client_Portable.spec
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force dist-portable | Out-Null
          Copy-Item dist\PT2VHF_APRS_Client_Portable_x64.exe "dist-portable\PT2VHF_APRS_Client_Portable_x64_v$version-radar-test.exe" -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-v1.7.22-Radar-Test-Windows-x64-Portable
          path: dist-portable\PT2VHF_APRS_Client_Portable_x64_v1.7.22-radar-test.exe
          retention-days: 7
