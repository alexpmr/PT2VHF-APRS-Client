name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Generate Windows icon
        shell: pwsh
        run: python windows\make_icon.py

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean windows\PT2VHF_APRS_Client.spec
          pyinstaller --noconfirm windows\PT2VHF_APRS_Client_Portable.spec

      - name: Generate SBOM and license inventory
        shell: pwsh
        run: |
          cyclonedx-py environment --spec-version 1.6 --output-format JSON --output-file dist\PT2VHF_APRS_Client\SBOM.cdx.json
          pip-licenses --format=plain-vertical --with-license-file --no-license-path --output-file=dist\PT2VHF_APRS_Client\THIRD_PARTY_LICENSES.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist\PT2VHF_APRS_Client\THIRD_PARTY_NOTICES.md
          Copy-Item LICENSE dist\PT2VHF_APRS_Client\LICENSE

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable EXE
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer.iss
          Copy-Item dist\PT2VHF_APRS_Client_Portable_x64.exe "dist-installer\PT2VHF_APRS_Client_Portable_x64_v$version.exe" -Force

      - name: Upload build artifacts
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-Windows-x64
          path: |
            dist-installer\PT2VHF_APRS_Client_Setup_x64_v*.exe
            dist-installer\PT2VHF_APRS_Client_Portable_x64_v*.exe
            dist\PT2VHF_APRS_Client\SBOM.cdx.json
            dist\PT2VHF_APRS_Client\THIRD_PARTY_LICENSES.txt

      - name: Publish GitHub Release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setupName = "PT2VHF_APRS_Client_Setup_x64_v$version.exe"
          $portableName = "PT2VHF_APRS_Client_Portable_x64_v$version.exe"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$version"
          }

          @"
          ## Política de assinatura de código

          **Status da assinatura:** esta versão permanece sem assinatura Authenticode enquanto o projeto aguarda a ativação da assinatura pelo SignPath Foundation.

          O projeto está preparado para o programa de assinatura Open Source do SignPath Foundation. Quando a assinatura estiver ativa, as versões assinadas usarão a atribuição exigida pelo programa:

          > **Free code signing provided by SignPath.io, certificate by SignPath Foundation**

          - [Política de assinatura de código](https://github.com/alexpmr/PT2VHF-APRS-Client/blob/main/CODE_SIGNING_POLICY.md)
          - [Política de privacidade](https://github.com/alexpmr/PT2VHF-APRS-Client/blob/main/PRIVACY.md)
          - [Avisos e licenças de terceiros](https://github.com/alexpmr/PT2VHF-APRS-Client/blob/main/THIRD_PARTY_NOTICES.md)

          ## Interface integrada no Windows

          A partir da v0.3.0, o PT2VHF APRS Client abre a interface em uma janela própria baseada no **Microsoft Edge WebView2**, sem depender de uma aba do navegador durante o uso normal.

          - Fechar a janela pelo **X** mantém o cliente ativo na bandeja.
          - Links externos continuam abrindo no navegador padrão.
          - O parâmetro `--browser` força o modo de diagnóstico pelo navegador.
          - Se o WebView2 Runtime estiver indisponível, o cliente informa o problema e utiliza o navegador como fallback.

          ## Arquivos para download

          - **$setupName** — instalador para Windows. **Opção recomendada para a maioria dos usuários.**
          - **$portableName** — versão portátil em um único arquivo EXE. **Não precisa ser instalada.**
          - **SBOM.cdx.json** — inventário técnico dos componentes de software utilizados na versão.
          - **THIRD_PARTY_LICENSES.txt** — relação das dependências de terceiros e respectivas licenças.
          "@ | Set-Content -Encoding UTF8 release-notes.md

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "PT2VHF APRS Client $tag" --notes-file release-notes.md
          } else {
            gh release edit $tag --title "PT2VHF APRS Client $tag" --notes-file release-notes.md
          }

          gh release upload $tag `
            "dist-installer\$setupName" `
            "dist-installer\$portableName" `
            dist\PT2VHF_APRS_Client\SBOM.cdx.json `
            dist\PT2VHF_APRS_Client\THIRD_PARTY_LICENSES.txt `
            --clobber
