name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Generate Windows icon
        shell: pwsh
        run: python windows\make_icon.py

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean windows\PT2VHF_APRS_Client.spec
          pyinstaller --noconfirm windows\PT2VHF_APRS_Client_Portable.spec

      - name: Generate SBOM and license inventory
        shell: pwsh
        run: |
          cyclonedx-py environment --spec-version 1.6 --output-format JSON --output-file dist\PT2VHF_APRS_Client\SBOM.cdx.json
          pip-licenses --format=plain-vertical --with-license-file --no-license-path --output-file=dist\PT2VHF_APRS_Client\THIRD_PARTY_LICENSES.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist\PT2VHF_APRS_Client\THIRD_PARTY_NOTICES.md
          Copy-Item LICENSE dist\PT2VHF_APRS_Client\LICENSE

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer.iss
          Copy-Item dist\PT2VHF_APRS_Client_Portable_x64.exe dist-installer\PT2VHF_APRS_Client_Portable_x64.exe -Force
          Compress-Archive -Path dist\PT2VHF_APRS_Client\* -DestinationPath dist-installer\PT2VHF_APRS_Client_Portable_x64.zip -Force

      - name: Upload build artifacts
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-Windows-x64
          path: |
            dist-installer\PT2VHF_APRS_Client_Setup_x64.exe
            dist-installer\PT2VHF_APRS_Client_Portable_x64.exe
            dist-installer\PT2VHF_APRS_Client_Portable_x64.zip
            dist\PT2VHF_APRS_Client\SBOM.cdx.json
            dist\PT2VHF_APRS_Client\THIRD_PARTY_LICENSES.txt

      - name: Publish GitHub Release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $version = (Get-Content VERSION -Raw).Trim()
            $tag = "v$version"
          }

          @"
          ## Code signing policy

          **Current signing status:** this release is unsigned unless its Windows files show a valid Authenticode signature from SignPath Foundation.

          The project is prepared for the SignPath Foundation Open Source Code Signing program. Once approval and signing are active, signed releases will carry the attribution:

          > **Free code signing provided by SignPath.io, certificate by SignPath Foundation**

          - [Code signing policy](https://github.com/alexpmr/PT2VHF-APRS-Client/blob/main/CODE_SIGNING_POLICY.md)
          - [Privacy policy](https://github.com/alexpmr/PT2VHF-APRS-Client/blob/main/PRIVACY.md)
          - [Third-party notices](https://github.com/alexpmr/PT2VHF-APRS-Client/blob/main/THIRD_PARTY_NOTICES.md)

          ## Downloads

          - **PT2VHF_APRS_Client_Setup_x64.exe** — Windows installer
          - **PT2VHF_APRS_Client_Portable_x64.exe** — single-file portable executable
          - **PT2VHF_APRS_Client_Portable_x64.zip** — portable onedir build
          - **SBOM.cdx.json** — CycloneDX software bill of materials
          - **THIRD_PARTY_LICENSES.txt** — generated dependency license inventory
          "@ | Set-Content -Encoding UTF8 release-notes.md

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "PT2VHF APRS Client $tag" --notes-file release-notes.md
          } else {
            gh release edit $tag --title "PT2VHF APRS Client $tag" --notes-file release-notes.md
          }

          gh release upload $tag `
            dist-installer\PT2VHF_APRS_Client_Setup_x64.exe `
            dist-installer\PT2VHF_APRS_Client_Portable_x64.exe `
            dist-installer\PT2VHF_APRS_Client_Portable_x64.zip `
            dist\PT2VHF_APRS_Client\SBOM.cdx.json `
            dist\PT2VHF_APRS_Client\THIRD_PARTY_LICENSES.txt `
            --clobber
