name: Build Windows + Linux + macOS + Manual

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  windows-x64:
    if: ${{ !contains(github.event.head_commit.message, '[portable-only]') && !contains(github.event.head_commit.message, '[linux-only]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Apply v1.6.4 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_4.py

      - name: Apply v1.6.5 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_5.py

      - name: Apply v1.6.6 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_6.py

      - name: Apply v1.6.8 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_8.py

      - name: Apply v1.6.9 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_9.py

      - name: Apply v1.6.10 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_10.py

      - name: Apply v1.6.11 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_11.py

      - name: Apply v1.6.12 diagnostic instrumentation
        shell: pwsh
        run: python tools\apply_release_1_6_12.py

      - name: Apply v1.6.13 CPU and SQLite optimization
        shell: pwsh
        run: python tools\apply_release_1_6_13.py

      - name: Apply v1.6.14 single-transaction RX
        shell: pwsh
        run: python tools\apply_release_1_6_14.py

      - name: Apply v1.6.15 map fan-out fix and gauges
        shell: pwsh
        run: python tools\apply_release_1_6_15.py

      - name: Apply v1.6.16 topology query fix
        shell: pwsh
        run: python tools\apply_release_1_6_16.py

      - name: Apply v1.6.17 full release validation
        shell: pwsh
        run: python tools\apply_release_1_6_17.py

      - name: Apply v1.6.18 APRS query diagnostics
        shell: pwsh
        run: python tools\apply_release_1_6_18.py

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Validate Python and JavaScript syntax
        shell: pwsh
        run: |
          python -m compileall -q pt2vhf_aprs windows_app.py linux_app.py macos_app.py tools
          node --check pt2vhf_aprs\static\js\app.js

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Generate Windows icon
        shell: pwsh
        run: python windows\make_icon.py

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean windows\PT2VHF_APRS_Client.spec
          pyinstaller --noconfirm windows\PT2VHF_APRS_Client_Portable.spec

      - name: Generate SBOM and license inventory
        shell: pwsh
        run: |
          cyclonedx-py environment --spec-version 1.6 --output-format JSON --output-file dist\PT2VHF_APRS_Client\SBOM.cdx.json
          pip-licenses --format=plain-vertical --with-license-file --no-license-path --output-file=dist\PT2VHF_APRS_Client\THIRD_PARTY_LICENSES.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist\PT2VHF_APRS_Client\THIRD_PARTY_NOTICES.md
          Copy-Item LICENSE dist\PT2VHF_APRS_Client\LICENSE

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer and portable EXE
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          $installerScript = Get-Content windows\installer.iss -Raw
          $installerScript = $installerScript -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`""
          Set-Content windows\installer.iss -Value $installerScript -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer.iss
          Copy-Item dist\PT2VHF_APRS_Client_Portable_x64.exe "dist-installer\PT2VHF_APRS_Client_Portable_x64_v$version.exe" -Force

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-Windows-x64
          path: |
            dist-installer\PT2VHF_APRS_Client_Setup_x64_v*.exe
            dist-installer\PT2VHF_APRS_Client_Portable_x64_v*.exe
            dist\PT2VHF_APRS_Client\SBOM.cdx.json
            dist\PT2VHF_APRS_Client\THIRD_PARTY_LICENSES.txt

      - name: Publish Windows release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setupName = "PT2VHF_APRS_Client_Setup_x64_v$version.exe"
          $portableName = "PT2VHF_APRS_Client_Portable_x64_v$version.exe"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$version"
          }

          python tools\release_notes.py --output release-notes.md

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "PT2VHF APRS Client $tag" --notes-file release-notes.md
          } else {
            gh release edit $tag --title "PT2VHF APRS Client $tag" --notes-file release-notes.md
          }

          gh release upload $tag `
            "dist-installer\$setupName" `
            "dist-installer\$portableName" `
            dist\PT2VHF_APRS_Client\SBOM.cdx.json `
            dist\PT2VHF_APRS_Client\THIRD_PARTY_LICENSES.txt `
            --clobber

  windows-portable-only:
    if: ${{ contains(github.event.head_commit.message, '[portable-only]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Apply v1.6.4 portable fixes
        shell: pwsh
        run: python tools\apply_release_1_6_4.py

      - name: Apply v1.6.5 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_5.py

      - name: Apply v1.6.6 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_6.py

      - name: Apply v1.6.8 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_8.py

      - name: Apply v1.6.9 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_9.py

      - name: Apply v1.6.10 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_10.py

      - name: Apply v1.6.11 fixes
        shell: pwsh
        run: python tools\apply_release_1_6_11.py

      - name: Apply v1.6.12 diagnostic instrumentation
        shell: pwsh
        run: python tools\apply_release_1_6_12.py

      - name: Apply v1.6.13 CPU and SQLite optimization
        shell: pwsh
        run: python tools\apply_release_1_6_13.py

      - name: Apply v1.6.14 single-transaction RX
        shell: pwsh
        run: python tools\apply_release_1_6_14.py

      - name: Apply v1.6.15 map fan-out fix and gauges
        shell: pwsh
        run: python tools\apply_release_1_6_15.py

      - name: Apply v1.6.16 topology query fix
        shell: pwsh
        run: python tools\apply_release_1_6_16.py

      - name: Apply v1.6.17 full release validation
        shell: pwsh
        run: python tools\apply_release_1_6_17.py

      - name: Apply v1.6.18 APRS query diagnostics
        shell: pwsh
        run: python tools\apply_release_1_6_18.py

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Validate Python and JavaScript syntax
        shell: pwsh
        run: |
          python -m compileall -q pt2vhf_aprs windows_app.py tools
          node --check pt2vhf_aprs\static\js\app.js

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Generate Windows icon
        shell: pwsh
        run: python windows\make_icon.py

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean windows\PT2VHF_APRS_Client_Portable.spec
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Force dist-portable | Out-Null
          Copy-Item dist\PT2VHF_APRS_Client_Portable_x64.exe "dist-portable\PT2VHF_APRS_Client_Portable_x64_v$version.exe" -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-Windows-Portable-x64
          path: dist-portable\PT2VHF_APRS_Client_Portable_x64_v*.exe

      - name: Publish portable-only release
        if: ${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $portableName = "PT2VHF_APRS_Client_Portable_x64_v$version.exe"

          python tools\release_notes.py --output release-notes.md

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "PT2VHF APRS Client $tag - Portable de teste" --notes-file release-notes.md
          } else {
            gh release edit $tag --title "PT2VHF APRS Client $tag - Portable de teste" --notes-file release-notes.md
          }

          gh release upload $tag "dist-portable\$portableName" --clobber

  linux-x64:
    needs: windows-x64
    if: ${{ always() && !contains(github.event.head_commit.message, '[windows-only]') && !contains(github.event.head_commit.message, '[portable-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Apply release fixes
        shell: bash
        run: |
          python tools/apply_release_1_6_4.py
          python tools/apply_release_1_6_5.py
          python tools/apply_release_1_6_6.py
          python tools/apply_release_1_6_8.py
          python tools/apply_release_1_6_9.py
          python tools/apply_release_1_6_10.py
          python tools/apply_release_1_6_11.py
          python tools/apply_release_1_6_12.py
          python tools/apply_release_1_6_13.py
          python tools/apply_release_1_6_14.py
          python tools/apply_release_1_6_15.py
          python tools/apply_release_1_6_16.py
          python tools/apply_release_1_6_17.py
          python tools/apply_release_1_6_18.py

      - name: Build Linux packages
        shell: bash
        run: |
          chmod +x linux/build_linux.sh
          PYTHON_BIN=python3 bash linux/build_linux.sh

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-Linux-x86_64
          path: |
            dist-linux/PT2VHF_APRS_Client_Linux_x86_64_v*.tar.gz
            dist-linux/PT2VHF_APRS_Client_x86_64_v*.AppImage
            dist-linux/pt2vhf-aprs-client_*_amd64.deb
            dist-linux/SBOM-Linux.cdx.json
            dist-linux/THIRD_PARTY_LICENSES_Linux.txt

      - name: Publish Linux release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n ' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi

          python tools/release_notes.py --output release-notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "PT2VHF APRS Client $tag" --notes-file release-notes.md
          else
            gh release edit "$tag" --title "PT2VHF APRS Client $tag" --notes-file release-notes.md
          fi

          gh release upload "$tag" \
            "dist-linux/PT2VHF_APRS_Client_Linux_x86_64_v$version.tar.gz" \
            "dist-linux/PT2VHF_APRS_Client_x86_64_v$version.AppImage" \
            "dist-linux/pt2vhf-aprs-client_${version}_amd64.deb" \
            dist-linux/SBOM-Linux.cdx.json \
            dist-linux/THIRD_PARTY_LICENSES_Linux.txt \
            --clobber

  linux-smoke:
    if: ${{ !contains(github.event.head_commit.message, '[windows-only]') && !contains(github.event.head_commit.message, '[portable-only]') }}
    name: linux-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Apply release fixes
        shell: bash
        run: |
          python tools/apply_release_1_6_4.py
          python tools/apply_release_1_6_5.py
          python tools/apply_release_1_6_6.py
          python tools/apply_release_1_6_8.py
          python tools/apply_release_1_6_9.py
          python tools/apply_release_1_6_10.py
          python tools/apply_release_1_6_11.py
          python tools/apply_release_1_6_12.py
          python tools/apply_release_1_6_13.py
          python tools/apply_release_1_6_14.py
          python tools/apply_release_1_6_15.py
          python tools/apply_release_1_6_16.py
          python tools/apply_release_1_6_17.py
          python tools/apply_release_1_6_18.py

      - name: Core smoke tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          python -m compileall -q pt2vhf_aprs linux_app.py tools
          python -m pytest -q

  macos:
    if: ${{ !contains(github.event.head_commit.message, '[windows-only]') && !contains(github.event.head_commit.message, '[linux-only]') && !contains(github.event.head_commit.message, '[windows-linux-only]') && !contains(github.event.head_commit.message, '[portable-only]') }}
    needs: windows-x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Apply release fixes
        shell: bash
        run: |
          python tools/apply_release_1_6_4.py
          python tools/apply_release_1_6_5.py
          python tools/apply_release_1_6_6.py
          python tools/apply_release_1_6_8.py
          python tools/apply_release_1_6_9.py
          python tools/apply_release_1_6_10.py
          python tools/apply_release_1_6_11.py
          python tools/apply_release_1_6_12.py
          python tools/apply_release_1_6_13.py
          python tools/apply_release_1_6_14.py
          python tools/apply_release_1_6_15.py
          python tools/apply_release_1_6_16.py
          python tools/apply_release_1_6_17.py
          python tools/apply_release_1_6_18.py

      - name: Build macOS DMG
        shell: bash
        run: |
          chmod +x macos/build_macos.sh
          PYTHON_BIN=python3 bash macos/build_macos.sh

      - name: Verify runner architecture
        shell: bash
        run: |
          actual="$(uname -m)"
          echo "Expected: ${{ matrix.arch }} / Actual: $actual"
          test "$actual" = "${{ matrix.arch }}"

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-macOS-${{ matrix.arch }}
          path: |
            dist-macos/PT2VHF_APRS_Client_macOS_${{ matrix.arch }}_v*.dmg
            dist-macos/SBOM-macOS-${{ matrix.arch }}.cdx.json
            dist-macos/THIRD_PARTY_LICENSES_macOS_${{ matrix.arch }}.txt

      - name: Publish macOS release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n ' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          gh release upload "$tag" \
            "dist-macos/PT2VHF_APRS_Client_macOS_${{ matrix.arch }}_v$version.dmg" \
            "dist-macos/SBOM-macOS-${{ matrix.arch }}.cdx.json" \
            "dist-macos/THIRD_PARTY_LICENSES_macOS_${{ matrix.arch }}.txt" \
            --clobber

  manual-pdf:
    if: ${{ !contains(github.event.head_commit.message, '[windows-only]') && !contains(github.event.head_commit.message, '[linux-only]') && !contains(github.event.head_commit.message, '[windows-linux-only]') && !contains(github.event.head_commit.message, '[portable-only]') }}
    needs: windows-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply release fixes
        shell: bash
        run: |
          python tools/apply_release_1_6_4.py
          python tools/apply_release_1_6_5.py
          python tools/apply_release_1_6_6.py
          python tools/apply_release_1_6_8.py
          python tools/apply_release_1_6_9.py
          python tools/apply_release_1_6_10.py
          python tools/apply_release_1_6_11.py
          python tools/apply_release_1_6_12.py
          python tools/apply_release_1_6_13.py
          python tools/apply_release_1_6_14.py
          python tools/apply_release_1_6_15.py
          python tools/apply_release_1_6_16.py
          python tools/apply_release_1_6_17.py
          python tools/apply_release_1_6_18.py

      - name: Generate versioned PDF manual
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "reportlab>=4.0,<5.0" "pypdf>=5.0,<7.0" "playwright>=1.55,<2.0" "cairosvg>=2.7,<3.0"
          python -m playwright install --with-deps chromium
          version="$(tr -d '\r\n ' < VERSION)"
          mkdir -p dist-docs/screenshots
          python -c "import cairosvg; cairosvg.svg2png(url='pt2vhf_aprs/static/img/app_logo.svg', write_to='dist-docs/manual_logo.png', output_width=1200)"
          python tools/capture_manual_screenshots.py --output-dir dist-docs/screenshots
          python tools/generate_manual.py --logo dist-docs/manual_logo.png --screenshots-dir dist-docs/screenshots --output "dist-docs/PT2VHF_APRS_Client_Manual_v$version.pdf"
          python tools/validate_manual.py "dist-docs/PT2VHF_APRS_Client_Manual_v$version.pdf"

      - name: Upload manual artifact
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-Manual
          path: dist-docs/PT2VHF_APRS_Client_Manual_v*.pdf

      - name: Publish manual in GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n ' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          gh release upload "$tag" "dist-docs/PT2VHF_APRS_Client_Manual_v$version.pdf" --clobber
