name: Build Raspberry Pi Linux ARM64

# v1.15.8: só manual. O build de produção (build-production-current.yml) já compila
# o ARM64 nativo e publica os pacotes na release; rodar este também no push à main
# disputava o upload do mesmo .deb e falhava (v1.15.7).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  raspberry-pi-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Confirm native ARM64 runner
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = "aarch64"
          python tools/apply_release_1_15_8.py
          echo "PT2VHF_VERSION=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_ENV"
      - name: Run regression tests and build three native ARM64 formats
        shell: bash
        run: |
          set -euo pipefail
          PT2VHF_LINUX_ARCH=arm64 PYTHON_BIN=python3 bash linux/build_linux.sh
      - name: Verify native binary and all three package formats
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < VERSION)"
          bin="dist/PT2VHF_APRS_Client_Linux_arm64"
          tar="dist-linux/PT2VHF_APRS_Client_Linux_arm64_v${version}.tar.gz"
          deb="dist-linux/pt2vhf-aprs-client_${version}_arm64.deb"
          image="dist-linux/PT2VHF_APRS_Client_arm64_v${version}.AppImage"
          readelf -h "$bin" | grep -Eq 'Machine:[[:space:]]*AArch64'
          test "$("$bin" --version)" = "$version"
          test "$(dpkg-deb -f "$deb" Architecture)" = "arm64"
          tar -tzf "$tar" > "$RUNNER_TEMP/arm64-tar-contents.txt"
          grep -Fq "PT2VHF_APRS_Client_Linux_arm64_v${version}" "$RUNNER_TEMP/arm64-tar-contents.txt"
          readelf -h "$image" | grep -Eq 'Machine:[[:space:]]*AArch64'
          test "$(APPIMAGE_EXTRACT_AND_RUN=1 "./$image" --version)" = "$version"
          .venv-build-linux/bin/python -m pytest -q tests/test_linux_arm64_distribution.py
          sha256sum "$tar" "$deb" "$image"
      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-APRS-Client-Linux-arm64-v${{ env.PT2VHF_VERSION }}
          if-no-files-found: error
          retention-days: 90
          path: |
            dist-linux/PT2VHF_APRS_Client_arm64_v${{ env.PT2VHF_VERSION }}.AppImage
            dist-linux/pt2vhf-aprs-client_${{ env.PT2VHF_VERSION }}_arm64.deb
            dist-linux/PT2VHF_APRS_Client_Linux_arm64_v${{ env.PT2VHF_VERSION }}.tar.gz
            dist-linux/SBOM-Linux.cdx.json
            dist-linux/THIRD_PARTY_LICENSES_Linux.txt
      - name: Attach native packages to existing GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          v="$PT2VHF_VERSION"
          # v1.15.7: a release é criada pelo build de produção, que roda em paralelo;
          # espera até 50 min por ela em vez de falhar.
          for i in $(seq 1 100); do
            gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release view "v$v" --repo "$GITHUB_REPOSITORY"
          gh release upload "v$v" \
            "dist-linux/PT2VHF_APRS_Client_arm64_v$v.AppImage" \
            "dist-linux/pt2vhf-aprs-client_${v}_arm64.deb" \
            "dist-linux/PT2VHF_APRS_Client_Linux_arm64_v$v.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -F "PT2VHF_APRS_Client_arm64_v$v.AppImage"
