name: Publish v0.1.0 source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild package and publish source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 | base64 --decode > /tmp/pt2vhf.zip
          rm -rf /tmp/pt2vhf
          mkdir -p /tmp/pt2vhf
          unzip -q /tmp/pt2vhf.zip -d /tmp/pt2vhf
          cp -a /tmp/pt2vhf/pt2vhf_aprs_client/. .
          rm -rf .bootstrap

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "release: publish PT2VHF APRS Client v0.1.0"
          git push
