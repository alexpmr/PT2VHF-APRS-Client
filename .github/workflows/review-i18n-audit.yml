name: Open localization audit review
on:
  push:
    branches: [fix/i18n-complete-audit]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Open review without merging or publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec 2> >(tee /tmp/i18n-pr-error.log >&2)
          trap 'code=$?; if [ "$code" -ne 0 ]; then python tools/report_ci_error.py /tmp/i18n-pr-error.log; fi' EXIT
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head fix/i18n-complete-audit --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr view "$existing" --repo "$GITHUB_REPOSITORY" --json url
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head fix/i18n-complete-audit --draft \
              --title 'fix(i18n): pente fino de textos estáticos e dinâmicos em seis idiomas' \
              --body-file docs/i18n-complete-audit.md
          fi
