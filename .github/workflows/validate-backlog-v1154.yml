name: Validate APRS v1.15.4 Backlog
on:
  push:
    branches:
      - release/v1.15.4-backlog
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Release invariants
        run: python tools/apply_release_1_15_4.py
      - name: Core regression tests
        run: python -m pytest -q tests/test_v1154_backlog.py tests/test_v11459_version_announce.py
      - name: Validate JavaScript
        run: node --check pt2vhf_aprs/static/js/app.js
