name: Build & publish APRS Catalina Intel Legacy

# CI só prepara candidato. Compilação homologada exige Mac Catalina local.
# Publicação oficial manual em outro workflow, após prova de execução Catalina.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-macos-catalina-legacy.yml'
      - 'macos/build_macos_legacy.sh'
      - 'macos/build_macos.sh'
      - 'macos/PT2VHF_APRS_Client_macOS.spec'
      - 'requirements-macos-legacy.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: macos-catalina-legacy
  cancel-in-progress: false

jobs:
  lint-legacy:
    name: Static CI validation for Catalina pipeline
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout APRS source
        uses: actions/checkout@v4
      - name: Validate build scripts, spec and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n macos/build_macos.sh macos/build_macos_legacy.sh
          python3 -m py_compile macos_app.py macos/make_icon.py
          python3 -c "import ast; ast.parse(open('macos/PT2VHF_APRS_Client_macOS.spec').read())"
          python3 -c "from pathlib import Path; p=Path('requirements-macos-legacy.txt').read_text(); assert 'pyobjc' in p and '-r requirements-macos.txt' in p"
      - name: Checkout site publication code
        uses: actions/checkout@v4
        with:
          repository: alexpmr/PT2VHF-Site
          path: site
      - name: Validate publication script and download-counter allowlist
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile site/scripts/publish_aprs_macos_legacy.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('site/download.php').read_text()
          assert "'mac-dmg-intel-legacy'" in s
          manifest=json.loads(Path('site/updates.json').read_text())
          assert manifest['products']['aprs']['version']==Path('VERSION').read_text().strip()
          PY

  candidate-intel:
    # O GitHub não executa macOS 10.15 em hosted ou self-hosted suportado.
    # Este job só gera CANDIDATO, nunca um release homologado Catalina.
    name: Build unverified compatibility candidate on macOS 15 Intel
    needs: lint-legacy
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      PT2VHF_MACOS_LEGACY: '1'
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      MACOS_REQUIREMENTS: requirements-macos-legacy.txt
      VENV: .venv-build-macos-candidate
    steps:
      - name: Checkout APRS source
        uses: actions/checkout@v4
      - name: Setup Python 3.10 Intel
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
      - name: Validate release
        run: python3 tools/apply_release_1_15_6.py
      - name: Build Intel candidate (NOT validated on Catalina)
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          PYTHON_BIN=python3 bash macos/build_macos.sh
          hdiutil verify dist-macos/PT2VHF_APRS_Client_macOS_Intel_Legacy_v*.dmg
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' 'dist/PT2VHF APRS Client.app/Contents/Info.plist')" = '10.15.0'
          echo "::warning::Candidate compiled on macOS 15 Intel. NOT tested or approved for Catalina; do not deploy to PT2VHF.com."
      - name: Upload candidate for local Catalina testing (not official release)
        uses: actions/upload-artifact@v4
        with:
          name: CANDIDATE-UNVERIFIED-macOS-Intel-Catalina
          if-no-files-found: error
          path: dist-macos/PT2VHF_APRS_Client_macOS_Intel_Legacy_v*.dmg
